name: custom-image-ccws1

# Builds the Claude 5.5 WebSearch compatibility image (backport of PR #8139 plus
# the WebSearch side-query normalization) together with the OpenAI/Codex
# reset-credit expiry auto-use backport (#6744 + #6950) with the bulk-update
# allowance for its config keys and the follow-up fix that lets a manual usage
# refresh clear a stale reset-credit query failure, for linux/amd64, and pushes
# it to GHCR. Triggered on pushes to the custom branch only.
on:
  push:
    branches:
      - custom/cc-websearch-5.5
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/lichking-2234/sub2api:0.2.19-ccws1
          build-args: |
            VERSION=v0.2.19-ccws1
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/LichKing-2234/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
