name: custom-image-ccws1

# Builds the Claude 5.5 WebSearch compatibility image (backport of PR #8139 plus
# the WebSearch side-query normalization) together with the OpenAI/Codex
# reset-credit expiry auto-use backport (#6744 + #6950) with the bulk-update
# allowance for its config keys and the follow-up fix that lets a manual usage
# refresh clear a stale reset-credit query failure, for linux/amd64, and pushes
# it to GHCR.
#
# Versioning is automatic: every push to main produces a unique
#   <nearest-git-tag>-ccws.<short-sha>
# image tag (for example 0.2.21-ccws.9b2b50e), so releasing a new image does
# NOT require a source commit to bump a version string. A manual release can
# optionally pass an explicit version via workflow_dispatch.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional image version/tag override (without the ghcr.io prefix)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image version
        id: meta
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            # Prefer the nearest reachable release tag; fall back to VERSION.
            BASE_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [ -z "$BASE_VERSION" ]; then
              BASE_VERSION="$(tr -d '\r\n' < backend/cmd/server/VERSION)"
            fi
            BASE_VERSION="${BASE_VERSION#v}"
            SHORT_SHA="${GITHUB_SHA:0:7}"
            VERSION="${BASE_VERSION}-ccws.${SHORT_SHA}"
          fi
          VERSION="${VERSION#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/lichking-2234/sub2api:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved image version: ${VERSION}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=v${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ github.event.repository.updated_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/LichKing-2234/sub2api
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
